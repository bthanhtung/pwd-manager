version: '3.8'

services:
  # Database MongoDB
  mongodb:
    image: mongo:latest
    container_name: pm_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Cache & Session Redis
  redis:
    image: redis:alpine
    container_name: pm_redis
    restart: always
    ports:
      - "6379:6379"

  # Backend NestJS
  backend:
    build: ./backend
    container_name: pm_backend
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/passmanager
    depends_on:
      - mongodb
      - redis
    networks:
      - pm_network

  # Frontend NextJS
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3000 # Hoặc domain của bạn
    container_name: pm_frontend
    restart: always
    ports:
      - "3001:3000" # Truy cập UI tại port 3001
    depends_on:
      - backend
    networks:
      - pm_network

networks:
  pm_network:
    driver: bridge

volumes:
  mongo_data: