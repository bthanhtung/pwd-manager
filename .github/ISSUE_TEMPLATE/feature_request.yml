name: Feature request
description: Suggest an improvement to OpenPass
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should OpenPass behave? Screenshots or sketches help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Vault and items
        - Sharing and teams
        - Sign-in and recovery
        - Import and export
        - Self-hosting and Docker
        - Web app UI
        - Documentation
        - Other
    validations:
      required: true
