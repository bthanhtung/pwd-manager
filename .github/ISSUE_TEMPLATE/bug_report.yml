name: Bug report
description: Something in OpenPass does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove passwords, tokens, personal data, and private files before pasting anything.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error messages, console output, or screenshots (redacted).
      render: shell
  - type: input
    id: version
    attributes:
      label: OpenPass version or commit
      description: From the app footer or `git rev-parse --short HEAD`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Docker on Ubuntu 24.04, PostgreSQL 17 / Chrome 141 on macOS 15
    validations:
      required: true
