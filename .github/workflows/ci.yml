name: CI
on:
  push: { branches: [main, v2] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - name: Server — install, typecheck, test
        working-directory: server
        run: npm ci && npm run typecheck && npm test && npm run test:pg
      - name: Web — install, typecheck, test, build
        working-directory: web
        run: npm ci && npx tsc -b && npm test && npx vite build --outDir ../server/public
      - name: Server — boots and serves the app
        working-directory: server
        run: |
          npm run build
          DATABASE_URL=sqlite::memory: PORT=8080 node dist/main.js &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">'
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: openpass }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - working-directory: server
        run: npm ci && TEST_DATABASE_URL=postgres://postgres:test@localhost:5432/openpass NODE_OPTIONS=--experimental-vm-modules npx jest --runInBand
